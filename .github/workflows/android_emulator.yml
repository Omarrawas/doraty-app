name: Android Emulator Tests

on:
  workflow_dispatch: # يتيح لك تشغيل هذا الأكشن يدوياً متى أردت
  # يمكنك إزالة علامة المربع أسفله إذا أردت تشغيله تلقائياً مع كل Push
  # push:
  #   branches: [ "main" ]

jobs:
  test:
    # يفضل تشغيل المحاكي على أنظمة macOS في GitHub Actions لأنها تدعم تسريع الأجهزة (Hardware Acceleration - HAXM) مما يجعله أسرع بكثير من Ubuntu
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # اختياري: إذا كان لديك ملفات .env مطلوبة لتشغيل التطبيق
      - name: Create .env file for tests
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}" >> .env

      - name: Run flutter build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # تشغيل محاكي أندرويد وإجراء الفحوصات
      - name: Run Android Emulator and Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30 # إصدار الأندرويد الذي تريد تشغيل المحاكي عليه
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            echo "المحاكي يعمل بنجاح! جاري البدء بالاختبار التلقائي (Integration Test)..."
            flutter test integration_test/app_test.dart

