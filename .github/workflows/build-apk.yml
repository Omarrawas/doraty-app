name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true

      # Prepare Keystore (optional)
      - name: Prepare keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
            printf "storeFile=android/app/key.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n" "${{ secrets.ANDROID_STORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_PASSWORD }}" "${{ secrets.ANDROID_KEY_ALIAS }}" > android/key.properties
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
