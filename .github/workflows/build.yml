name: Build Flutter APK

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Step 1: Java 17 MUST come before Flutter
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Step 2: Force Gradle to use Java 17 explicitly
      - name: Force Java 17 for Gradle
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      # Step 3: Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"

      - name: Get dependencies
        run: flutter pub get

      # Step 4: Inject Supabase secrets
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      # Step 5: Build
      - name: Build APK
        run: flutter build apk --debug

      # Step 6: Upload artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doraty-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
