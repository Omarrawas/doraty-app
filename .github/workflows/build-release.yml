name: Flutter Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*" # يعمل عند عمل Tag مثل v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ Java 17 (Required for flutter_secure_storage & modern AGP)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ✅ Flutter (Stable Channel with Cache)
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "stable"
          cache: true

      # ✅ Cache Gradle (5x faster builds)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ✅ Decode Keystore from Base64 Secret & Write key.properties
      - name: Setup Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
          cat > android/key.properties <<EOF
          storeFile=key.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOF

      # ✅ Flutter dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # ✅ Build Release APK
      - name: Build APK (Release)
        run: flutter build apk --release

      # ✅ Build Release AAB (Google Play Store)
      - name: Build AAB (Release)
        run: flutter build appbundle --release

      # ✅ Upload APK as Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # ✅ Upload AAB as Artifact
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # ✅ Create GitHub Release with APK + AAB attached
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
