name: Doraty Flutter CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write  # Required for creating GitHub Releases

jobs:
  build:
    name: Build & Release APK + AAB
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      # 🧩 1) Checkout Repo
      - name: Checkout code
        uses: actions/checkout@v4

      # ☕ 2) Setup Java 17 (Required for flutter_secure_storage & modern AGP)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🐦 3) Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ⚡ 4) Cache Flutter Pub
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-

      # ⚡ 5) Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 📦 5) Get Dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # 🔐 6) Decode Keystore + Create key.properties
      - name: Setup Keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          cat > android/key.properties <<EOF
          storeFile=key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # 🌐 8) Supabase env vars are already available via job-level env

      # 🏗️ 9) Build APK
      - name: Build APK Release
        run: flutter build apk --release

      # 🏗️ 10) Build AAB
      - name: Build AAB Release
        run: flutter build appbundle --release

      # 🚀 11) Upload to GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Doraty Release v${{ github.run_number }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🤖 12) Send APK to Telegram
      - name: Send APK to Telegram
        continue-on-error: true  # لا يوقف الـ Workflow إذا فشل إرسال Telegram
        run: |
          curl -F document=@build/app/outputs/flutter-apk/app-release.apk \
          https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument \
          -F chat_id=$TELEGRAM_CHAT_ID
