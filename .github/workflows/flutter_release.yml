name: Doraty CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: Doraty

jobs:

  build:
    name: Build Android + Windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Decode Android Keystore
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/key.jks
          cat > android/key.properties <<EOF
          storeFile=key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Build APK
      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
          --dart-define=SUPABASE_URL="$SUPABASE_URL" \
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      # Build AAB
      - name: Build AAB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build appbundle --release \
          --dart-define=SUPABASE_URL="$SUPABASE_URL" \
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      # Enable Windows build
      - name: Enable Windows
        run: flutter config --enable-windows-desktop

      # Build Windows
      - name: Build Windows
        run: flutter build windows --release

      # Zip Windows build
      - name: Zip Windows
        run: |
          cd build/windows/x64/runner/Release
          zip -r ../../../../../Doraty-Windows.zip .

      # Generate Changelog
      - name: Generate Changelog
        run: |
          git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 || echo HEAD^)..HEAD > CHANGELOG.md || echo "Initial release" > CHANGELOG.md

      # Create Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Doraty Release ${{ github.run_number }}
          body_path: CHANGELOG.md
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            Doraty-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Telegram Notification
      - name: Send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🚀 Doraty Release ${{ github.run_number }}

          Android APK:
          https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/app-release.apk

          Android AAB:
          https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/app-release.aab

          Windows:
          https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/Doraty-Windows.zip
          "

          curl -s -X POST https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d text="$MSG"
