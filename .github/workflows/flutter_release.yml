name: Doraty Ultimate CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: Doraty
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

# ================= ANDROID BUILD =================
jobs:
  android:
    name: Android Build
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4
      
      # 2️⃣ Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4️⃣ Flutter Pub Get
      - run: flutter pub get

      # 5️⃣ Keystore
      - name: Decode Keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/key.jks
          cat > android/key.properties <<EOF
          storeFile=key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # 6️⃣ Build Android
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - run: flutter build apk --release --split-per-abi

      # 7️⃣ Upload  artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

        
# ================= WINDOWS BUILD =================
  windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Zip Windows Build
        run: powershell Compress-Archive build/windows/x64/runner/Release Doraty-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Doraty-Windows.zip

# ================= LINUX BUILD =================
  linux:
    name: Linux Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - run: tar -czvf Doraty-Linux.tar.gz build/linux/x64/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: Doraty-Linux.tar.gz

# ================= RELEASE + TELEGRAM =================
  release:
    name: Release All
    needs: [android, windows, linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      # Auto version
      - name: Generate Version
        id: version
        run: echo "VERSION=v$(date +%Y.%m.%d)-${{ github.run_number }}" >> $GITHUB_ENV

      # Changelog
      - name: Generate Changelog
        run: |
          git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 || echo HEAD^)..HEAD > CHANGELOG.md

      #Build APK Split (Telegram safe)
      - name: Build APK Split ABI
        run: flutter build apk --release --split-per-abi

      # Create Release
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: Doraty Release ${{ github.run_number }}
          body_path: CHANGELOG.md
          files: |
            android-build/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            android-build/app-release.aab
            windows-build/Doraty-Windows.zip
            linux-build/Doraty-Linux.tar.gz
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Telegram Send APK only (limit)
      - name: Send APK to Telegram
        run: |
          curl -F document=@android-build/app-release.apk \
          https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument \
          -F chat_id=${TELEGRAM_CHAT_ID}
