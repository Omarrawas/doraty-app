<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Doraty - أكاديمية دوراتي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Doraty - أكاديمية دوراتي</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Firebase Messaging Service Worker -->
  <!-- Enhanced Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        // 1. Flutter's auto-generated SW (handles Dart/JS bundle)
        navigator.serviceWorker.register('flutter_service_worker.js?v=' + new Date().getTime(), {
          scope: './'
        }).then(function (reg) {
          console.log('[SW] Flutter SW registered');
          reg.onupdatefound = function () {
            const w = reg.installing;
            w.onstatechange = function () {
              if (w.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('[SW] New Flutter content available — refresh to update.');
              }
            };
          };
        }).catch(function (err) {
          console.error('[SW] Flutter SW registration failed:', err);
        });

        // 2. Doraty tiered-cache SW (handles API, fonts, images)
        navigator.serviceWorker.register('/doraty-sw.js', {
          scope: '/'
        }).then(function () {
          console.log('[SW] Doraty tiered-cache SW registered');
        }).catch(function (err) {
          console.warn('[SW] Doraty SW registration failed (non-critical):', err);
        });

        // 3. Firebase Messaging SW (push notifications)
        navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(() => {});
      });
    }
  </script>
  <style>
    body {
      inset: 0;
      overflow: hidden;
      margin: 0;
      padding: 0;
      position: fixed;
      background-color: #0b0114;
      /* Dark purple background matching the theme */
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cairo', sans-serif;
    }
  
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
  
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid #FFF;
      border-bottom-color: #7B2CBF;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }
  
    .logo-img {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      animation: pulsate 2s ease-in-out infinite;
    }
  
    @keyframes rotation {
      0% {
        transform: rotate(0deg);
      }
  
      100% {
        transform: rotate(360deg);
      }
    }
  
    @keyframes pulsate {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
  
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
  
      100% {
        transform: scale(0.95);
        opacity: 0.8;
      }
    }
  
    .loading-text {
      color: white;
      margin-top: 16px;
      font-size: 18px;
      font-weight: 500;
    }
  </style>
  <script src="assets/packages/flutter_tex/core/flutter_tex.js" defer></script>
  <script src="assets/packages/flutter_tex/core/mathjax_core.js" defer></script>
  <!--  PDF Web Support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js" defer></script>
  <script type="text/javascript">
    window.pdfjsLib = window['pdfjs-dist/build/pdf'];
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js";
    }
  </script>
</head>
<body>
  <div id="loading-container">
    <img src="icons/Icon-192.png" alt="Doraty Logo" class="logo-img">
    <span class="loader"></span>
    <div class="loading-text">جاري تحميل منصة دوراتي...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('load', function (ev) {
      // The loader will be removed automatically by Flutter once initialized
      // but we can also manually hide it once the first frame is rendered if needed.
    });
  </script>
</body>
</html>
