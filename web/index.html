<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Doraty - أكاديمية دوراتي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Doraty - أكاديمية دوراتي</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Firebase Messaging Service Worker -->
  <!-- Enhanced Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        // 1. Flutter's auto-generated SW (handles Dart/JS bundle)
        navigator.serviceWorker.register('flutter_service_worker.js?v=' + new Date().getTime(), {
          scope: './'
        }).then(function (reg) {
          console.log('[SW] Flutter SW registered');
          reg.onupdatefound = function () {
            const w = reg.installing;
            w.onstatechange = function () {
              if (w.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('[SW] New Flutter content available — refresh to update.');
              }
            };
          };
        }).catch(function (err) {
          console.error('[SW] Flutter SW registration failed:', err);
        });

        // 2. Doraty tiered-cache SW (handles API, fonts, images)
        navigator.serviceWorker.register('/doraty-sw.js', {
          scope: '/'
        }).then(function () {
          console.log('[SW] Doraty tiered-cache SW registered');
        }).catch(function (err) {
          console.warn('[SW] Doraty SW registration failed (non-critical):', err);
        });

        // 3. Firebase Messaging SW (push notifications)
        navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(() => {});
      });
    }
  </script>
  <style>
    body {
      inset: 0;
      overflow: hidden;
      margin: 0;
      padding: 0;
      position: fixed;
      background-color: #0b0114;
    }
  </style>
  <script src="assets/packages/flutter_tex/js/flutter_tex.js" defer></script>

  <!--  PDF Web Support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js" defer></script>
  <script type="text/javascript">
    window.pdfjsLib = window['pdfjs-dist/build/pdf'];
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js";
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
