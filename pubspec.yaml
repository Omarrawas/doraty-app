name: doraty
description: " أكاديمية دوراتي التلعيمية"
publish_to: 'none'
version: 1.1.7+28

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^6.3.0
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  
  # State Management
  provider: ^6.1.1
  
  # UI Components
  cupertino_icons: ^1.0.2
  google_fonts: ^8.0.2
  font_awesome_flutter: ^10.7.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  pointer_interceptor: ^0.10.1+1
  
  # Video Player
  video_player: ^2.8.1
  chewie: ^1.7.4
  youtube_player_flutter: ^9.1.3
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  
  # Supabase
  supabase_flutter: ^2.0.0
  # Env loader for runtime secrets
  flutter_dotenv: ^6.0.0
  

  # Storage & Cache
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.2
  image_picker: ^1.2.1
  share_plus: ^10.1.4
  timeago: ^3.7.0
  lottie: ^3.1.2 # Added for animation support
  
  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.4

  # PDF Viewer
  flutter_pdfview: ^1.3.2
  syncfusion_flutter_pdfviewer: ^32.2.9
  
  # Notifications
  flutter_local_notifications: ^20.1.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  
  # HTML & Markdown
  flutter_markdown_plus: ^1.0.5
  flutter_widget_from_html: ^0.17.1

  flutter_tex: ^5.2.6
  webview_flutter: ^4.7.0
  flutter_inappwebview: ^6.1.5
  universal_html: ^2.1.0
  
  # Interactive Components
  file_picker: ^10.3.7
  path: ^1.9.1
  curved_navigation_bar: ^1.0.3
  
  # Audio
  audioplayers: ^6.5.1
  
  # Rich Text Editor
  flutter_quill: ^11.5.0
  vsc_quill_delta_to_html: ^1.0.5
  flutter_quill_delta_from_html: ^1.0.0+4
  
  # Security & Local Server
  encrypt: ^5.0.3
  flutter_secure_storage: ^10.0.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  mime: ^2.0.0
  youtube_explode_dart: ^3.0.5
  envied: ^1.3.3

  # Local Storage & Permissions
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  permission_handler: ^12.0.1
  connectivity_plus: ^7.0.0
  package_info_plus: ^9.0.0
  in_app_update: ^4.0.2
  
  # QR Code
  mobile_scanner: ^7.1.4
  qr_flutter: ^4.1.0
  uuid: ^4.5.1
  video_player_win: ^3.2.2
  no_screenshot: ^0.10.0
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

  envied_generator: ^1.1.1
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.7
  flutter_native_splash: ^2.4.3



flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/

    - assets/icons/
    - assets/sounds/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/logo.png"
  web:
    generate: true
    image_path: "assets/icons/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#7B2CBF"

msix_config:
  display_name: Doraty - أكاديمية دوراتي
  publisher_display_name: Omarrawas
  identity_name: Omarrawas.Doraty
  logo_path: assets/icons/logo.png
  store_logo_path: assets/icons/logo.png
  protocol_activation: 
    - doraty
  capabilities:
    - internetClient

flutter_native_splash:
  color: "#6B4CE6"
  image: "assets/icons/logo.png"
  android_12:
    color: "#6B4CE6"
    image: "assets/icons/logo.png"
