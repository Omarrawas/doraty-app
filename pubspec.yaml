name: doraty
description: "منصة تعليمية لطلاب الثانوية العامة في سوريا"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # UI Components
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  table_calendar: ^3.0.9
  
  # Video Player
  video_player: ^2.8.1
  chewie: ^1.7.4
  youtube_player_flutter: ^9.1.3
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  
  # Supabase
  supabase_flutter: ^2.0.0
  # Env loader for runtime secrets
  flutter_dotenv: ^5.0.2
  
  # Storage & Cache
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.2
  image_picker: ^1.2.1
  
  # PDF Viewer
  flutter_pdfview: ^1.3.2
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  
  # HTML & Markdown
  flutter_markdown: ^0.6.18
  flutter_widget_from_html: ^0.15.0
  flutter_tts: ^3.8.3
  webview_flutter: ^4.7.0
  
  # Interactive Components
  flip_card: ^0.7.0
  file_picker: ^10.3.7
  path: ^1.9.1
  
  # Rich Text Editor
  flutter_quill: ^9.3.0
  
  # Security & Local Server
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.0.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  mime: ^1.0.6
  youtube_explode_dart: ^2.0.2
  envied: ^0.5.4

  # Local Storage & Permissions
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  envied_generator: ^0.5.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
