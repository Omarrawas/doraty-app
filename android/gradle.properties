org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Workaround: avoid Kotlin compile daemon connection issues on some JDKs/Windows setups
# This forces the Kotlin compiler to run in-process instead of using the daemon.
# Remove this after JDK / Gradle issues are resolved if you prefer daemon compilation.
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4096M